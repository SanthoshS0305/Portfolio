name: Update Instagram Data

on:
  schedule:
    - cron: '0 3 * * 0'        # weekly Sunday 3am UTC
  repository_dispatch:
    types: [apify-instagram-update]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Trigger Apify actor run
        id: trigger
        if: github.event_name != 'repository_dispatch'
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.apify.com/v2/acts/apify~instagram-post-scraper/runs?token=${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"username\":[\"${{ vars.INSTAGRAM_USERNAME }}\"],\"resultsType\":\"reels\",\"resultsLimit\":50}")
          echo "Apify response: $RESPONSE"
          RUN_ID=$(echo "$RESPONSE" | jq -r '.data.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "Failed to start Apify run. See response above."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Apify run to complete
        if: steps.trigger.outputs.run_id != ''
        timeout-minutes: 15
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          while true; do
            POLL=$(curl -s \
              "https://api.apify.com/v2/actor-runs/$RUN_ID?token=${{ secrets.APIFY_TOKEN }}")
            STATUS=$(echo "$POLL" | jq -r '.data.status // empty')
            echo "Run status: $STATUS"
            case "$STATUS" in
              SUCCEEDED) break ;;
              FAILED|ABORTED|TIMED-OUT) echo "Apify run ended with: $STATUS"; exit 1 ;;
            esac
            sleep 30
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        run: npm install --no-save dotenv @sanity/client

      - name: Run sync script
        run: node scripts/sync-instagram.js
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
